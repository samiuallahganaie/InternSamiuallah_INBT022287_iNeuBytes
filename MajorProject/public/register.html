<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Willow Grove Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 24" width="28" height="16"><polyline points="0,12 10,12 14,3 19,21 23,12 40,12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Willow Grove Clinic
    </a>
    <h1>Create an account</h1>
    <p class="auth-sub">Register as a patient, doctor, or admin.</p>

    <div class="form-banner" id="registerBanner"></div>

    <form class="auth-form" id="registerForm" novalidate>
      <div>
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="+91 98765 43210">
      </div>
      <div>
        <label for="role">Register as</label>
        <select id="role" required>
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required>
      </div>
      <div>
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
