<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Willow Grove Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 24" width="28" height="16"><polyline points="0,12 10,12 14,3 19,21 23,12 40,12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Willow Grove Clinic
    </a>
    <h1>Sign in</h1>
    <p class="auth-sub">Access your patient, doctor, or admin dashboard.</p>

    <div class="form-banner" id="loginBanner"></div>

    <form class="auth-form" id="loginForm" novalidate>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/register.html">Register here</a></p>

    <div class="demo-creds">
      <strong>Demo accounts</strong> (password: <strong>password123</strong> for all):<br>
      Admin: <strong>admin@willowgrove.example</strong><br>
      Doctor: <strong>arjun.kapoor@willowgrove.example</strong><br>
      Patient: <strong>patient@willowgrove.example</strong>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
