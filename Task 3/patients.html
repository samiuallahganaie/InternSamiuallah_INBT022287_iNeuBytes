<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Management — Willow Grove Clinic Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

<div class="dashboard-shell">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 24" width="28" height="16"><polyline points="0,12 10,12 14,3 19,21 23,12 40,12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Willow Grove Admin
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html">Dashboard Home</a></li>
      <li><a href="doctors.html">Doctor Management</a></li>
      <li><a href="patients.html">Patient Management</a></li>
      <li><a href="appointments.html">Appointment Management</a></li>
      <li><a href="departments.html">Department Management</a></li>
    </ul>
  </aside>

  <div class="dashboard-main">
    <header class="topnav">
      <div class="topnav-title">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu"><span></span><span></span><span></span></button>
        <h1 style="font-size:1.1rem; margin:0;">Patient Management</h1>
      </div>
      <div class="topnav-profile">
        <div class="profile-meta">
          <span class="profile-name">Shruti Kumari</span>
          <span class="profile-role">Admin · HR</span>
        </div>
        <div class="profile-avatar">SK</div>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="page-header">
        <div>
          <h1>Patients</h1>
          <p>View, add, edit, delete, and search registered patients.</p>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input type="text" id="patientSearchInput" placeholder="Search by name…">
          <div class="toolbar-spacer"></div>
          <button class="btn btn-primary" id="addPatientBtn">+ Add Patient</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
            <tbody id="patientsTableBody"><!-- populated by JS --></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ===== SHARED MODAL ===== -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-title-row">
      <h2 id="modalTitle">Add Patient</h2>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <form class="modal-form" id="modalForm"></form>
    <button hidden id="modalCancel"></button>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-script.js"></script>
</body>
</html>
